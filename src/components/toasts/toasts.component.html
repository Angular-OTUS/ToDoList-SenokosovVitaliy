<div class="toasts-container">
  @for (toast of toasts(); track toast.id) {
    <div class="toast toast--{{ toast.type }}">
      <span class="toast__message">{{ toast.message }}</span>
      <button
        class="toast__close"
        (click)="dismiss(toast.id)"
        [attr.aria-label]="'toasts.close' | translate"
      >×</button>
    </div>
  }
</div>
